name: Deploy para GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Baixar repositório
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Instalar dependências
        run: |
          npm ci
          npm rebuild esbuild

      - name: Verificar TypeScript
        run: npm run typecheck
        continue-on-error: true

      - name: Gerar aplicação estática
        run: |
          npx vite build > vite-build.log 2>&1 || {
            cat vite-build.log
            echo "::error title=Vite build falhou::$(tr '\n' ' ' < vite-build.log | cut -c1-1500)"
            exit 1
          }
          cat vite-build.log

      - name: Desativar processamento Jekyll
        run: touch dist/.nojekyll

      - name: Preparar GitHub Pages
        uses: actions/configure-pages@v5

      - name: Enviar artefato
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Publicar no GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
